<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saaf – Photo background remover</title>
<style>
:root{--bg:#f2f0fa;--panel:#fff;--ink:#1c1738;--mute:#6a6585;--line:#dedaf0;--acc:#5a3df0;--accink:#fff;--soft:#ebe7ff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#120f24;--panel:#1b1735;--ink:#ece9ff;--mute:#9a95b8;--line:#2f2a52;--acc:#8b74ff;--accink:#140e3a;--soft:#272150;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding:0 16px 32px;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand svg{width:34px;height:34px}
.brand small{font-weight:500;font-size:14px;color:var(--mute);letter-spacing:0}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px}
.stage{padding:18px;flex:1}
.drop{border:2px dashed var(--line);border-radius:14px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;cursor:pointer;transition:background .15s,border-color .15s}
.drop.over,.drop:hover{background:var(--soft);border-color:var(--acc)}
.drop h2{margin:0;font-size:24px;letter-spacing:-.01em}
.drop p{margin:0;color:var(--mute)}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:11px 20px;font-weight:700}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hide{display:none!important}
.work{display:grid;grid-template-columns:1fr 260px;gap:18px}
@media (max-width:760px){.work{grid-template-columns:1fr}}
.canvasbox{border:1px solid var(--line);border-radius:14px;min-height:340px;display:grid;place-items:center;padding:12px;position:relative;background:var(--bg)}
.cmp{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:8px;overflow:hidden;--p:50%;user-select:none}
.cmp .res{display:block;max-width:100%;max-height:62vh}
.cmp .org{position:absolute;inset:0;width:100%;height:100%;clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.cmp .knob{position:absolute;top:50%;left:var(--p);width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4);display:grid;place-items:center;color:#333;font-size:14px;line-height:1}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.checker{background-color:#fff;background-image:linear-gradient(45deg,#cfd3dc 25%,transparent 25%),linear-gradient(-45deg,#cfd3dc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfd3dc 75%),linear-gradient(-45deg,transparent 75%,#cfd3dc 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.tags{position:absolute;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;font-size:13px;pointer-events:none}
.tags span{background:rgba(20,16,40,.7);color:#fff;border-radius:6px;padding:1px 8px}
.side h3{margin:0 0 8px;font-size:15px}
.side section{margin-bottom:18px}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw button{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);padding:0}
.sw button[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sw input[type=color]{width:100%;height:100%;border:0;padding:0;background:none;opacity:0;position:absolute;inset:0;cursor:pointer}
.sw .cust{position:relative;border-radius:10px;border:2px solid var(--line);aspect-ratio:1;background:conic-gradient(#f43f5e,#f59e0b,#22c55e,#06b6d4,#6366f1,#f43f5e);overflow:hidden}
.col{display:flex;flex-direction:column;gap:8px}
#msg{margin:10px 0 0;color:var(--mute);min-height:24px}
#msg.err{color:var(--err)}
.hist{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hist button{width:56px;height:56px;border-radius:10px;border:2px solid var(--line);padding:0;overflow:hidden;background:var(--bg)}
.hist button[aria-current=true]{border-color:var(--acc)}
.hist img{width:100%;height:100%;object-fit:cover;display:block}
.busy{position:absolute;inset:0;background:color-mix(in srgb,var(--panel) 80%,transparent);display:grid;place-items:center;border-radius:14px;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--acc);animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(10,8,25,.5)}
dialog input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;margin:8px 0 14px}
dialog h2{margin:0;font-size:20px}
.row{display:flex;gap:8px;justify-content:flex-end}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--acc)"/><circle cx="20" cy="15" r="6" fill="var(--accink)"/><path d="M8 33c1-7 6-10 12-10s11 3 12 10" fill="var(--accink)"/><path d="M5 5l30 30" stroke="var(--acc)" stroke-width="3"/></svg>
      <span>Saaf <small>photo background remover</small></span>
    </div>
    <button class="icon" id="cfg" aria-label="API key settings" title="API key settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </button>
  </header>

  <main class="card stage">
    <div id="drop" class="drop" tabindex="0" role="button" aria-label="Photo chunein">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
      <h2>Photo yahan daliye</h2>
      <p>Drop kijiye, paste kijiye (Ctrl+V) ya neeche button se chuniye</p>
      <button class="btn" type="button" id="pickbtn">Photo chuniye</button>
      <p style="font-size:13px">JPG, PNG, WebP · 22 MB tak</p>
    </div>
    <input id="file" type="file" accept="image/*" class="hide">

    <div id="work" class="work hide">
      <div>
        <div class="canvasbox" id="box">
          <img id="pre" alt="Aapki photo" class="hide" style="max-width:100%;max-height:62vh;border-radius:8px">
          <div class="cmp checker hide" id="cmp">
            <img class="res" id="res" alt="Background hata hua result">
            <img class="org" id="org" alt="Original photo">
            <div class="bar"></div><div class="knob" aria-hidden="true">&#8596;</div>
            <input type="range" id="rng" min="0" max="100" value="50" aria-label="Original aur result compare karein">
          </div>
          <div class="tags hide" id="tags"><span>Original</span><span>Saaf</span></div>
          <div class="busy hide" id="busy"><div><div class="spin"></div>Background hataya ja raha hai…</div></div>
        </div>
        <p id="msg" role="status"></p>
        <div class="hist" id="hist"></div>
      </div>
      <aside class="side">
        <section>
          <h3>Background</h3>
          <div class="sw" id="sw"></div>
        </section>
        <section class="col">
          <button class="btn" id="dl" disabled>PNG download kijiye</button>
          <button class="btn sec" id="retry" disabled>Dobara try kijiye</button>
          <button class="btn sec" id="newp">Nayi photo</button>
        </section>
      </aside>
    </div>
  </main>
  <div style="margin-top:16px;display:flex;justify-content:center;overflow:hidden">
    <script async="async" data-cfasync="false" src="https://bauval.org/21/fbbc1241aa29cb755ef53c66fb633319"></script>
    <div id="container-fbbc1241aa29cb755ef53c66fb633319"></div>
  </div>
  <footer>Aapki photo sirf remove.bg ko bheji jaati hai, aur kahin save nahi hoti.</footer>
</div>

<dialog id="dlg">
  <h2>API key</h2>
  <label for="keyin" style="color:var(--mute);font-size:14px">remove.bg ki key</label>
  <input id="keyin" type="password" autocomplete="off">
  <div class="row"><button class="btn sec" id="kc">Band karein</button><button class="btn" id="ks">Save kijiye</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_KEY = 'MdqRHzRWCBSNSBgiRB7jptJs';
let KEY = DEFAULT_KEY;
try { KEY = localStorage.getItem('saaf_key') || DEFAULT_KEY; } catch(e) {}

let cur = null;            // {file, origUrl, cutImg}
let hist = [];
let bg = 'transparent';

/* ---------- background swatches ---------- */
const colors = ['transparent', '#ffffff', '#111111', '#ef4444', '#f59e0b', '#22c55e', '#06b6d4', '#5a3df0', '#ec4899'];
const sw = $('sw');
colors.forEach(c => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('aria-label', c === 'transparent' ? 'Transparent' : 'Rang ' + c);
  b.setAttribute('aria-pressed', c === bg);
  if (c === 'transparent') b.className = 'checker'; else b.style.background = c;
  b.onclick = () => setBg(c);
  sw.appendChild(b);
});
const cust = document.createElement('div');
cust.className = 'cust'; cust.title = 'Apna rang';
cust.innerHTML = '<input type="color" value="#5a3df0" aria-label="Apna rang chuniye">';
cust.firstChild.oninput = e => setBg(e.target.value);
sw.appendChild(cust);

function setBg(c) {
  bg = c;
  [...sw.querySelectorAll('button')].forEach((b, i) => b.setAttribute('aria-pressed', colors[i] === c));
  const cmp = $('cmp');
  cmp.classList.toggle('checker', c === 'transparent');
  cmp.style.background = c === 'transparent' ? '' : c;
}

/* ---------- picking a photo ---------- */
const drop = $('drop');
const say = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('newp').onclick = () => $('file').click();
$('file').onchange = e => { load(e.target.files[0]); e.target.value = ''; };
['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => load(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) load(it.getAsFile());
});

function load(f) {
  if (!f || !f.type.startsWith('image/')) return;
  if (f.size > 22 * 1024 * 1024) { alert('Photo 22 MB se chhoti honi chahiye.'); return; }
  cur = { file: f, origUrl: URL.createObjectURL(f), cutImg: null };
  show('pre'); $('pre').src = cur.origUrl;
  drop.classList.add('hide'); $('work').classList.remove('hide');
  process();
}

function show(which) {   // 'pre' = only photo, 'cmp' = compare view
  $('pre').classList.toggle('hide', which !== 'pre');
  $('cmp').classList.toggle('hide', which !== 'cmp');
  $('tags').classList.toggle('hide', which !== 'cmp');
  $('dl').disabled = $('retry').disabled = which !== 'cmp';
}

/* ---------- remove.bg call ---------- */
async function process() {
  const item = cur;
  $('busy').classList.remove('hide'); $('dl').disabled = $('retry').disabled = true; say('');
  try {
    const fd = new FormData();
    fd.append('image_file', item.file);
    fd.append('size', 'auto');
    const r = await fetch('https://api.remove.bg/v1.0/removebg', { method: 'POST', headers: { 'X-Api-Key': KEY }, body: fd });
    if (!r.ok) {
      let m = 'Error ' + r.status;
      try { const j = await r.json(); if (j.errors?.[0]) m = j.errors[0].title + (j.errors[0].detail ? ': ' + j.errors[0].detail : ''); } catch(e) {}
      throw new Error(m);
    }
    const url = URL.createObjectURL(await r.blob());
    const img = new Image(); img.src = url; await img.decode();
    item.cutImg = img;
    if (cur === item) { render(); say('Ho gaya! Slider hila kar pehle aur baad dekhiye.'); }
    if (!hist.includes(item)) { hist.unshift(item); hist = hist.slice(0, 8); }
    drawHist();
  } catch (e) {
    if (cur === item) { show('pre'); $('retry').disabled = false; say('Nahi ho paya: ' + e.message, true); }
  } finally { $('busy').classList.add('hide'); }
}
$('retry').onclick = () => cur && process();

function render() {
  $('res').src = cur.cutImg.src; $('org').src = cur.origUrl;
  $('rng').value = 50; $('cmp').style.setProperty('--p', '50%');
  setBg(bg); show('cmp');
}
$('rng').oninput = e => $('cmp').style.setProperty('--p', e.target.value + '%');

function drawHist() {
  const h = $('hist'); h.innerHTML = '';
  hist.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-label', 'Pehli photo kholiye');
    b.setAttribute('aria-current', it === cur);
    b.innerHTML = '<img alt="">'; b.firstChild.src = it.origUrl;
    b.onclick = () => { cur = it; it.cutImg ? render() : (show('pre'), $('pre').src = it.origUrl); drawHist(); };
    h.appendChild(b);
  });
}

/* ---------- download ---------- */
$('dl').onclick = () => {
  const im = cur?.cutImg; if (!im) return;
  const c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d');
  if (bg !== 'transparent') { g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(im, 0, 0);
  c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = (cur.file.name.replace(/\.[^.]+$/, '') || 'photo') + '-saaf.png';
    a.click();
  }, 'image/png');
};

/* ---------- key settings ---------- */
const dlg = $('dlg');
$('cfg').onclick = () => { $('keyin').value = KEY; dlg.showModal(); };
$('kc').onclick = () => dlg.close();
$('ks').onclick = () => {
  const v = $('keyin').value.trim();
  if (v) { KEY = v; try { localStorage.setItem('saaf_key', v); } catch(e) {} }
  dlg.close();
};
</script>
</body>
</html>
